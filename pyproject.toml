[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "self-optimize"
version = "0.1.0"
description = "Python project optimizer driven by AST analysis, LLM candidate generation, and iterative evaluation."
readme = "INTENT.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
self-optimize = "self_optimize.cli:main"
self_optimize = "self_optimize.cli:main"
clean-runs = "self_optimize.clean_runs:main"
clean_runs = "self_optimize.clean_runs:main"

[tool.hatch.build.targets.wheel]
only-include = [
    "analyze",
    "candidates",
    "context_builder",
    "llm",
    "orchestrator",
    "project_loader",
    "self_optimize",
    "config.py",
    "main.py",
    "recovery.py",
    "report.py",
    "state_storage.py",
]

[tool.uv]
package = true
